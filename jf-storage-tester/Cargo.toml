[package]
name = "jf-storage-tester"
version = "0.1.0"
edition = "2021"
description = "JF Storage Tester — egui shell (layout); inspired by winui_egui_example / WINDOWS11_EGUI_STYLE_GUIDE"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_plot = "0.31"
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
png = "0.17"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series", "full_palette", "ttf"] }
plotters-bitmap = "0.3"
raw-window-handle = "0.6"
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2.9", features = ["json"] }

[target.'cfg(windows)'.dependencies]
rand = "0.8"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wmi = "0.18"

[build-dependencies]
winresource = "0.1"
woff2-patched = "0.4"
