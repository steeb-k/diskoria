[package]
name = "diskoria"
version = "1.1.0"
edition = "2021"
description = "Diskoria ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“ Windows storage scanning and benchmarking (egui)"

[dependencies]
chrono = "0.4"
egui = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
egui_plot = "0.31"
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
png = "0.17"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series", "full_palette", "ttf"] }
plotters-bitmap = "0.3"
rfd = "0.15"
pollster = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
softbuffer = { version = "0.4", default-features = false }
ureq = { version = "2.9", features = ["json"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
arboard = "3"
rand = "0.8"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wmi = "0.18"

[build-dependencies]
winresource = "0.1"
woff2-patched = "0.4"
