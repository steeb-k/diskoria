[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Cross-building the ARM64 Linux release from an x86-64 host. Linux has no
# x64-on-ARM emulation, so aarch64 needs its own binary (see docs/releasing.md).
# Requires: rustup target add aarch64-unknown-linux-gnu
#           the aarch64-linux-gnu-gcc cross toolchain (also used by the `cc`
#           crate to build rusqlite's bundled SQLite for the target).
# Harmless when the toolchain is absent — this only applies to explicit
# `--target aarch64-unknown-linux-gnu` builds.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
